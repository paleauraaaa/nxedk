[package]
name = "xam-sys"
version = "0.1.0"
edition = "2024"
build = "../build.rs"

[dependencies]
windef-sys = { path = "../windef-sys" }

[build-dependencies]
bindgen = { version = "=0.73.2", default-features = false, features = ["runtime"] }
clang-sys = { version = "1", features = ["runtime"] }
regex = "1"
shlex = "2"
